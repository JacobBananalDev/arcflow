version: "3.9"

services:
  db:
    image: postgres:15
    container_name: arcflow-db
    restart: always
    environment:
      POSTGRES_USER: arcflow
      POSTGRES_PASSWORD: arcflow
      POSTGRES_DB: arcflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate
    container_name: arcflow-migrate
    depends_on:
      - db
    volumes:
      - ./backend/migrations:/migrations
    entrypoint: [
      "migrate",
      "-path=/migrations",
      "-database=postgres://arcflow:arcflow@db:5432/arcflow?sslmode=disable"
    ]

volumes:
  postgres_data:
