version: "3.9"

services:
  db:
    image: postgres:15
    container_name: arcflow-db
    restart: always
    environment:
      POSTGRES_USER: arcflow
      POSTGRES_PASSWORD: arcflow
      POSTGRES_DB: arcflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
